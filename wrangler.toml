name = "ctyun-keeper-cf"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 账号配置 + 会话缓存存放在 KV
# 部署前请先创建 KV 命名空间并把 id 填到下面：
#   wrangler kv namespace create CTYUN_KV
[[kv_namespaces]]
binding = "CTYUN_KV"
id = "6ea7469b1cae4012abd78d5813efb8b9"

# 后台访问令牌（必填）：保护 /api/* 与网页后台
#   wrangler secret put ADMIN_TOKEN
# 部署后打开 https://<你的子域>.workers.dev/ 输入该令牌即可管理账号/看日志。
# 说明：这是“访问令牌”并非云电脑账号密码，可设一段足够长的随机字符串。

# Cron 定时触发：每 10 分钟一次。
# 说明：改为 10 分钟是为了在「尽量不写 KV」前提下，仍能每分钟级别地
# 记录 cronHeartbeat（每天 144 次写入，远低于免费版 1000 次/天限额），
# 让页面能真实显示「上次定时执行于何时 / 心跳正常与否」。
# 若需更密可改回 "*/1 * * * *"，但那样 cronHeartbeat 会超额，需另想办法。
[triggers]
crons = ["*/10 * * * *"]
